name: Build and deploy website

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashijie-src/package-lock.json

      - name: Install dependencies
        working-directory: dashijie-src
        run: npm ci

      - name: Build Dashijie
        working-directory: dashijie-src
        run: npm run build

      - name: Assemble Pages site
        run: |
          mkdir _site

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dashijie-src' \
            --exclude='_site' \
            ./ _site/

          rm -rf _site/dashijie
          mkdir -p _site/dashijie

          cp -a dashijie-src/dist/. _site/dashijie/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4